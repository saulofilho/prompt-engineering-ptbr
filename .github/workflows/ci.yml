name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=8,<10" "ruff>=0.6,<0.9"

      - name: Skills em dia (skills/ == .cursor/skills/)
        run: python tools/sync_skills.py --check

      - name: Dataset válido
        run: python tools/validar_dataset.py

      - name: Invariantes dos marcadores (piloto v0)
        run: python poc/01_tokenizacao.py --checar

      - name: Autochecagem da rubrica
        run: python evaluation/automatico/checagem_v0.py

      - name: Lint
        run: ruff check .

      - name: Testes
        run: pytest

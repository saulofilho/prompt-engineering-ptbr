<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>og</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=JetBrains+Mono:wght@700&display=swap">
<style>
  *{margin:0;box-sizing:border-box}
  html,body{background:#0E0B07}
  .card{
    width:1200px;height:630px;background:#16120E;color:#F1E7D3;
    font-family:"Archivo",sans-serif;position:relative;overflow:hidden;
    padding:64px 68px;display:flex;flex-direction:column;justify-content:space-between;
  }
  .top{display:flex;justify-content:space-between;align-items:baseline;
    font-family:"JetBrains Mono",monospace;font-size:21px;font-weight:700;
    text-transform:lowercase;letter-spacing:.04em;color:#78AC57;
    border-bottom:2px solid rgba(241,231,211,.44);padding-bottom:20px}
  .top .r{color:#B49A78}
  .mid{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  .kick{font-weight:800;font-size:40px;text-transform:lowercase;line-height:1.04;max-width:16ch}
  .word{font-weight:900;font-size:244px;line-height:.78;letter-spacing:-.03em;
    text-transform:lowercase;color:#5E9040;margin:-4px 0 0 -8px}
  .bottom{display:flex;justify-content:space-between;align-items:flex-end;
    border-top:2px solid rgba(241,231,211,.44);padding-top:22px}
  .stats{display:flex;gap:40px;font-family:"JetBrains Mono",monospace}
  .stat b{display:block;font-family:"Archivo",sans-serif;font-weight:900;font-size:52px;line-height:1}
  .stat span{font-size:15px;color:#B49A78;text-transform:lowercase}
  .s1 b{color:#5E9040}.s2 b{color:#C49A6E}.s3 b{color:#A05CA1}
  .url{font-family:"JetBrains Mono",monospace;font-size:19px;color:#B49A78;text-transform:lowercase;text-align:right}
  .url b{color:#F1E7D3;display:block;font-size:22px}
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="top">
      <span>engenharia de prompt em português brasileiro</span>
      <span class="r">pt-br</span>
    </div>
    <div class="mid">
      <div class="kick">prompts em português que se medem</div>
      <div class="word">preciso</div>
    </div>
    <div class="bottom">
      <div class="stats">
        <div class="stat s1"><b>5,5%</b><span>forma controlada · h6</span></div>
        <div class="stat s2"><b>12</b><span>tarefas pareadas</span></div>
        <div class="stat s3"><b>8</b><span>hipóteses</span></div>
      </div>
      <div class="url"><b>prompt preciso</b>saulofilho.github.io/prompt-engineering-ptbr</div>
    </div>
  </div>
</body>
</html>
